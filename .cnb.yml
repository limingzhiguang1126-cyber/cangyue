# ============================================================
# CNB 云原生构建 · 定时任务流水线
# 用途：让 v1.1 信号扫描 + Telegram 推送跑在 CNB 云端（无需自购服务器）
#
#  1) 每天 07:35 刷新候选池 smallcap_top100_fdv.json（FDV 最小 Top100）
#  2) 每 15 分钟（*/15）扫描候选池，命中 v1.1 信号推送 Telegram
#     （CNB 定时任务最小间隔为 5 分钟，此处按 v1.1 标准设为 15 分钟轮询节奏）
#
# 敏感信息（TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID）通过密钥仓库
# qiang26/cangyue-secrets 的 telegram.yml 注入（用户已建好并提交）。
# 如需换仓库，仅需替换下方 imports 中的路径即可。
# ============================================================

main:
  # ---- 每日刷新候选池 ----
  "crontab: 35 7 * * *":
    - name: refresh-pool
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: pip install -q -r requirements.txt
        - name: refresh-smallcap-pool
          script: |
            python -m src.screener.binance_smallcap --top 100 --sort fdv \
              --output data/smallcap_top100_fdv.json
        - name: commit-and-push-pool
          script: |
            set -e
            git config user.name "cnb"
            git config user.email "cnb@cnb.cool"
            git add data/smallcap_top100_fdv.json
            if git diff --cached --quiet; then
              echo "pool unchanged, skip commit"
            else
              git commit -m "chore(screener): 刷新 FDV Top100 候选池 [cron]"
              git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" HEAD:main
            fi

  # ---- 每 15 分钟扫描 + 推送信号 ----
  "crontab: */15 * * * *":
    - name: v11-signal-scan
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: pip install -q -r requirements.txt
        - name: scan-and-push
          script: |
            python scripts/v11_cloud_run.py --top 100 --push-state

# ============================================================
# 网页手动触发（Web Trigger）—— 由 .cnb/web_trigger.yml 的按钮唤起
#   · 手动信号扫描：点击「立即扫描信号」→ 立即跑一轮 v1.1 信号扫描并推送
#   · 手动刷新候选池：点击「立即刷新候选池」→ 刷新 FDV Top100 并自动提交
# ============================================================
$:
  web_trigger_scan_signals:
    - name: manual-scan-signals
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: pip install -q -r requirements.txt
        - name: scan-and-push
          script: |
            set -e
            TOP="${top:-100}"
            echo "[web_trigger] manual scan: top=${TOP} dry_run=${dry_run:-false}"
            if [ "${dry_run:-false}" = "true" ]; then
              python scripts/v11_cloud_run.py --top "$TOP" --dry-run
            else
              python scripts/v11_cloud_run.py --top "$TOP" --push-state
            fi

  web_trigger_refresh_pool:
    - name: manual-refresh-pool
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: pip install -q -r requirements.txt
        - name: refresh-smallcap-pool
          script: |
            python -m src.screener.binance_smallcap --top 100 --sort fdv \
              --output data/smallcap_top100_fdv.json
        - name: commit-and-push-pool
          script: |
            set -e
            git config user.name "cnb"
            git config user.email "cnb@cnb.cool"
            git add data/smallcap_top100_fdv.json
            if git diff --cached --quiet; then
              echo "pool unchanged, skip commit"
            else
              git commit -m "chore(screener): 刷新 FDV Top100 候选池 [web-trigger]"
              git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" HEAD:${CNB_BRANCH:-main}
            fi

  web_trigger_test_push:
    - name: manual-test-push
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: pip install -q -r requirements.txt
        - name: test-push
          script: |
            echo "[web_trigger] Telegram 推送链路测试"
            python scripts/tg_test_push_cloud.py

  web_trigger_deploy_hf:
    - name: deploy-hf-space
      docker:
        image: python:3.11-slim
      imports:
        - https://cnb.cool/qiang26/cangyue-secrets/-/blob/main/telegram.yml
      stages:
        - name: install-deps
          script: |
            pip install -q -r requirements.txt
            pip install -q "huggingface_hub>=0.23"
        - name: deploy-to-hf
          script: |
            set -e
            SPACE="${space_name:-fin-alert}"
            echo "[web_trigger] 部署 HF Space: ${SPACE}"
            if [ -z "${HF_TOKEN:-}" ]; then
              echo "错误：密钥仓库 telegram.yml 中未配置 HF_TOKEN（hf_...）"
              echo "请先到 https://huggingface.co/settings/tokens 新建 Read/write 令牌，"
              echo "然后添加到 qiang26/cangyue-secrets 仓库的 telegram.yml："
              echo '  HF_TOKEN: "hf_你的令牌"'
              exit 1
            fi
            python scripts/deploy_hf.py --space-name "${SPACE}" --deploy \
              --tg-token "${TELEGRAM_BOT_TOKEN:-}" --tg-chat "${TELEGRAM_CHAT_ID:-}"
        - name: print-result
          script: |
            echo "✅ 部署完成！请到 Hugging Face 查看构建状态："
            echo "   https://huggingface.co/spaces/fin-alert"
            echo "（用户名请以 HF 实际账号为准）"
