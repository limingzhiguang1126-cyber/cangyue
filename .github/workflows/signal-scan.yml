# ============================================================
# GitHub Actions · v1.2 信号定时扫描 + Telegram 推送
#
# 目的：让「每 15 分钟扫一次 FDV Top100 候选池，命中 v1.2 信号
#       推送到 Telegram」跑在 GitHub 托管 Runner 上（海外网络，
#       可直连 api.telegram.org，无墙），且完全免费。
#
# 与 CNB 云原生定时任务（.cnb.yml）二选一即可；本工作流更优：
#   · GitHub 海外 Runner 直连 Telegram，无需海外 Bot API 代理
#   · public 仓库 Actions 免费、分钟数无限，无需保活
#   · 每次独立拉起一轮扫描 + 推送，天然契合「任务型」场景
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TELEGRAM_BOT_TOKEN    @BotFather 创建 Bot 的 token（必填）
#   TELEGRAM_CHAT_ID      你的用户 ID（@userinfobot 可查，必填）
#
# 可选：TELEGRAM_API_BASE  若 Telegram 直连失败，指向海外 Bot API 代理
#
# 注意：
#   - 每 15 分钟一次 cron。GitHub 免费仓库的 cron 可能被延迟，但通常
#     每轮 5~10 分钟内会执行，符合「小市值信号扫描」的节奏。
#   - 去重状态 data/v11_signal_state.json 由本工作流自动提交回仓库，
#     确保同标的同信号线 2h 内只推一次（与 CNB 版逻辑一致）。
#   - 「候选池刷新」由 refresh-pool.yml 每天 07:35 自动完成；手动点击
#     workflow_dispatch 时也可顺手刷新一次。
# ============================================================

name: v1.2 信号扫描 + Telegram 推送

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "扫描候选池数量（默认 100）"
        required: false
        default: "100"
      dry_run:
        description: "只打印不推送（调试用，不需要 Telegram 密钥）"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write   # 允许把去重状态文件推回仓库

concurrency:
  group: signal-scan
  cancel-in-progress: false   # 避免并发轮次互相覆盖去重状态

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 手动触发时刷新候选池（可选）
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m src.screener.binance_smallcap --top 100 --sort fdv \
            --output data/smallcap_top100_fdv.json

      - name: 扫描信号并推送 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            python scripts/v11_cloud_run.py --top "$TOP" --dry-run
          else
            python scripts/v11_cloud_run.py --top "$TOP" --push-state
          fi
